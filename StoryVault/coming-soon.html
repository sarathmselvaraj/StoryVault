<!DOCTYPE html>

<html data-bs-theme="light" dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>A New Chapter Is Coming Soon | StoryVault</title><link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg"/>
<link href="assets/css/bootstrap.min.css" rel="stylesheet"/>
<link href="assets/css/style.css" rel="stylesheet"/>
<link href="assets/css/dark-mode.css" rel="stylesheet"/>
<link href="assets/css/rtl.css" rel="stylesheet"/>
<link href="assets/css/responsive.css" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4 text-center bg-surface-alt">
<div class="container" style="max-width: 650px;">
<div class="story-card p-5 glow-effect">
<a class="navbar-brand justify-content-center text-dark fs-2 mb-3 d-inline-flex" href="index.html">
<i class="fa-solid fa-book-bookmark text-primary"></i>
<span>StoryVault</span>
</a>
<span class="badge badge-glow mb-3"><i class="fa-solid fa-sparkles me-1"></i> Grand Opening Announcement</span>
<h1 class="font-heading display-5 fw-bold mb-3">A New Chapter Is Coming Soon</h1>
<p class="text-muted mb-4">We are polishing our reading lounges and cataloging rare additions. Stay tuned for our grand launch.</p>
<!-- Countdown Display -->
<div class="row g-3 justify-content-center mb-4">
<div class="col-3">
<div class="p-3 bg-surface-alt rounded-3 border border-color">
<h2 class="fw-bold mb-0 text-primary" id="cnt-days">14</h2>
<small class="text-muted">Days</small>
</div>
</div>
<div class="col-3">
<div class="p-3 bg-surface-alt rounded-3 border border-color">
<h2 class="fw-bold mb-0 text-primary" id="cnt-hours">08</h2>
<small class="text-muted">Hours</small>
</div>
</div>
<div class="col-3">
<div class="p-3 bg-surface-alt rounded-3 border border-color">
<h2 class="fw-bold mb-0 text-primary" id="cnt-mins">42</h2>
<small class="text-muted">Mins</small>
</div>
</div>
<div class="col-3">
<div class="p-3 bg-surface-alt rounded-3 border border-color">
<h2 class="fw-bold mb-0 text-primary" id="cnt-secs">15</h2>
<small class="text-muted">Secs</small>
</div>
</div>
</div>
<!-- Newsletter Signup -->
<form class="needs-validation max-w-500 mx-auto" novalidate="">
<div class="input-group">
<input class="form-control" placeholder="Enter your email address" required="" type="email"/>
<button class="btn btn-story-primary glow-effect" type="submit">Notify Me</button>
</div>
</form>
</div>
</div>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
        // Simple live countdown timer logic
        let sec = 15, min = 42, hr = 8, day = 14;
        setInterval(() => {
            sec--;
            if (sec < 0) { sec = 59; min--; }
            if (min < 0) { min = 59; hr--; }
            document.getElementById('cnt-secs').textContent = String(sec).padStart(2, '0');
            document.getElementById('cnt-mins').textContent = String(min).padStart(2, '0');
            document.getElementById('cnt-hours').textContent = String(hr).padStart(2, '0');
            document.getElementById('cnt-days').textContent = String(day).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
