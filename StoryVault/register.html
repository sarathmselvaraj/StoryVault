<!DOCTYPE html>

<html data-bs-theme="light" dir="ltr" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Create Member Account | StoryVault</title><link href="assets/images/favicon.svg" rel="icon" type="image/svg+xml"/><link href="assets/css/bootstrap.min.css" rel="stylesheet"/><link href="assets/css/style.css" rel="stylesheet"/><link href="assets/css/dark-mode.css" rel="stylesheet"/><link href="assets/css/rtl.css" rel="stylesheet"/><link href="assets/css/responsive.css" rel="stylesheet"/></head>
<body class="auth-page min-vh-100 py-4"><div class="position-fixed top-0 end-0 m-3 z-3 d-flex gap-2"><button class="btn-icon-toggle theme-toggle-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button><button class="btn-icon-toggle rtl-toggle-btn" onclick="toggleRTL()"><i class="fa-solid fa-right-left"></i></button></div>
<main class="container auth-shell" style="max-width:520px;"><div class="story-card auth-card p-4 p-md-5 glow-effect"><div class="text-center mb-4"><a class="navbar-brand justify-content-center fs-2 mb-3" href="index.html"><i class="fa-solid fa-book-bookmark"></i><span>StoryVault</span></a><span class="section-subtitle">Join the Reading Community</span><h1 class="h3 font-heading fw-bold mb-2">Create Member Account</h1><p class="small text-muted mb-0">Your account will open the member portal after registration.</p></div>
<form class="needs-validation" id="registerForm" novalidate="" onsubmit="registerMember(event)"><div class="mb-3"><label class="form-label fw-semibold" for="registerName">Full Name *</label><input class="form-control" id="registerName" placeholder="Aarav Sharma" required="" type="text"/></div><div class="mb-3"><label class="form-label fw-semibold" for="registerEmail">Email Address *</label><input class="form-control" id="registerEmail" placeholder="aarav@example.com" required="" type="email"/></div><div class="mb-3"><label class="form-label fw-semibold" for="registerPhone">Phone Number</label><input class="form-control" id="registerPhone" pattern="[0-9+\-\s]{10,16}" placeholder="+91 98765 43210" type="tel"/></div><div class="mb-3"><label class="form-label fw-semibold" for="registerCity">City</label><input autocomplete="address-level2" class="form-control" id="registerCity" placeholder="Bengaluru" type="text"/></div><div class="mb-3"><label class="form-label fw-semibold" for="registerPassword">Password *</label><input class="form-control" id="registerPassword" minlength="8" placeholder="At least 8 characters" required="" type="password"/></div><div class="form-check mb-4"><input class="form-check-input" id="termsCheck" required="" type="checkbox"/><label class="form-check-label small" for="termsCheck">I agree to the StoryVault Terms &amp; Privacy Policy.</label></div><button class="btn btn-story btn-story-primary w-100 glow-effect" type="submit">Create Account</button>
<div class="social-login-block mt-3">
<div class="auth-divider"><span>or register as a member</span></div>
<div class="row g-2">
<div class="col-12 col-sm-6"><button class="social-login-btn google-login-btn" onclick="handleSocialLogin('google')" type="button"><i class="fa-brands fa-google"></i><span>Google</span></button></div>
<div class="col-12 col-sm-6"><button class="social-login-btn apple-login-btn" onclick="handleSocialLogin('apple')" type="button"><i class="fa-brands fa-apple"></i><span>Apple</span></button></div>
</div>
</div>
<div class="text-center mt-4"><span class="small text-muted">Already a member? <a class="fw-bold" href="login.html">Sign In</a></span></div></form></div><div class="auth-footer text-center mt-3"><a class="navbar-brand justify-content-center fs-6" href="index.html"><i class="fa-solid fa-book-bookmark"></i><span>StoryVault</span></a><small class="text-muted">© 2026 StoryVault India</small></div></main><script src="assets/js/bootstrap.bundle.min.js"></script><script src="assets/js/main.js"></script></body></html>
